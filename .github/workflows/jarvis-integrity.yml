name: JARVIS public reference integrity
on:
  workflow_dispatch:
  schedule:
    - cron: '23 12 * * *'
  push:
    branches: [main]
    paths:
      - 'jarvis-public-reference/**'
      - 'security/jarvis_baseline.json'
      - 'scripts/jarvis_integrity.py'
      - 'tests/test_jarvis_integrity.py'
      - '.github/workflows/jarvis-integrity.yml'
  pull_request:
    paths:
      - 'jarvis-public-reference/**'
      - 'security/jarvis_baseline.json'
      - 'scripts/jarvis_integrity.py'
      - 'tests/test_jarvis_integrity.py'
      - '.github/workflows/jarvis-integrity.yml'
permissions:
  contents: read
concurrency:
  group: jarvis-integrity
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, SHA pinned
        with:
          persist-credentials: false
      - name: Offline unit tests
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_jarvis_integrity.py'
      - name: Verify public historic baseline
        shell: bash
        run: python3 scripts/jarvis_integrity.py --root . --manifest security/jarvis_baseline.json
